url: https://byuzbasi.github.io/LHWL/

template:
  bootstrap: 5
  math-rendering: katex
  bslib:
    primary: "#176B72"
    link-color: "#146269"
    border-radius: 0.3rem
home:
  title: Lorentz Hyperbolic Weighted Learning
  description: >
    Local regression and focal variable selection in a Lorentz-hyperbolic
    representation. LHWR is the original foundation; LHWPR is its penalized
    extension.
navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, author, github]
  components:
    author:
      text: Research hub
      href: https://byuzbasi.github.io/en/software/
    github:
      icon: fab fa-github
      href: https://github.com/byuzbasi/LHWL
      aria-label: GitHub repository
    intro:
      text: Get started
      href: articles/lorentz-hgwr-introduction.html
